name: CI

# Triggers on push or pull request targeting master or main
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  desktop-test:
    name: Run Desktop Tests & Rust Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Nexus Parent/desktop/src-tauri -> target"
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare Test Firebase .env Stub
        shell: powershell
        run: |
          @(
            'apiKey="ci-test-api-key"'
            'authDomain="nexus-ci-test.firebaseapp.com"'
            'databaseURL="https://nexus-ci-test-default-rtdb.firebaseio.com"'
            'projectId="nexus-ci-test"'
            'storageBucket="nexus-ci-test.appspot.com"'
            'appId="1:000000000000:web:0000000000000000"'
          ) | Set-Content -Path ".env" -Encoding UTF8

      - name: Run Desktop TypeScript Build & Tests
        shell: powershell
        run: |
          cd "Nexus Parent/desktop"
          npm install
          npm test

      - name: Run Rust Backend Unit Tests
        shell: powershell
        run: |
          cd "Nexus Parent/desktop/src-tauri"
          cargo test

  android-child-test:
    name: Run Nexus Child Android Unit Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Root Environment Stub
        run: |
          touch .env
          echo 'apiKey="test"' >> .env
          echo 'projectId="test"' >> .env
          echo 'databaseURL="https://test.firebaseio.com"' >> .env
          echo 'appId="1:000000000000:android:0000000000000000"' >> .env

      - name: Run Nexus Child Unit Test Suite
        working-directory: "Nexus Child"
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

  android-parent-test:
    name: Run Nexus Parent Android Unit Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Root Environment Stub
        run: |
          touch .env
          echo 'apiKey="test"' >> .env
          echo 'projectId="test"' >> .env
          echo 'databaseURL="https://test.firebaseio.com"' >> .env
          echo 'appId="1:000000000000:android:0000000000000000"' >> .env

      - name: Run Nexus Parent Android Unit Test Suite
        working-directory: "Nexus Parent/android"
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
