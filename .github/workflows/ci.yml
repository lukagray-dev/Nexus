name: CI

# Triggers on push or pull request targeting master or main
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  desktop-test:
    name: Run Desktop Tests & Rust Validation (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Nexus Parent/desktop/src-tauri -> target"
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Desktop TypeScript Build & Tests
        shell: powershell
        run: |
          cd "Nexus Parent/desktop"
          npm install
          npm test

      - name: Verify Rust Backend Compilation
        shell: powershell
        run: |
          cd "Nexus Parent/desktop/src-tauri"
          cargo check

  android-test:
    name: Run Android Unit Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Root Environment Stub
        run: |
          touch .env
          echo 'apiKey="test"' >> .env
          echo 'projectId="test"' >> .env
          echo 'databaseURL="https://test.firebaseio.com"' >> .env

      - name: Run Android Unit Test Suite
        working-directory: "Nexus Child"
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
