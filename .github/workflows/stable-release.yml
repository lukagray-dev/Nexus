name: Stable Release

# Triggers manually via workflow_dispatch on master/main
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version tag (e.g., v0.1.0, v1.0.0). Leave empty to auto-increment from latest stable release.'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release title (defaults to Nexus {version})'
        required: false
        type: string
        default: ''

jobs:
  version:
    name: Determine Stable Release Version Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.bump.outputs.RELEASE_TAG }}
      release_title: ${{ steps.bump.outputs.RELEASE_TITLE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine stable version tag
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            const manualVersion = '${{ inputs.version }}'.trim();
            const manualTitle = '${{ inputs.release_title }}'.trim();

            let targetTag = manualVersion;

            if (!targetTag) {
              const { data: tags } = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });

              // Filter for stable tags matching pattern v*.*.* (without -alpha or -beta)
              const stableRegex = /^v\d+\.\d+\.\d+$/;
              const stableTags = tags
                .map(t => t.name)
                .filter(name => stableRegex.test(name));

              const parseStableVersion = (v) => {
                const match = v.match(/^v(\d+)\.(\d+)\.(\d+)$/);
                if (!match) return [0, 0, 0];
                return [parseInt(match[1], 10), parseInt(match[2], 10), parseInt(match[3], 10)];
              };

              stableTags.sort((a, b) => {
                const [majA, minA, patchA] = parseStableVersion(a);
                const [majB, minB, patchB] = parseStableVersion(b);
                if (majA !== majB) return majB - majA;
                if (minA !== minB) return minB - minA;
                return patchB - patchA;
              });

              if (stableTags.length === 0) {
                targetTag = 'v0.1.0';
              } else {
                const [maj, min, patch] = parseStableVersion(stableTags[0]);
                targetTag = `v${maj}.${min}.${patch + 1}`;
              }
              console.log(`Latest stable tag found: ${stableTags[0] || 'none'}`);
            }

            const title = manualTitle || `Nexus ${targetTag}`;
            console.log(`Resolved stable tag: ${targetTag}`);
            console.log(`Resolved release title: ${title}`);

            core.setOutput('RELEASE_TAG', targetTag);
            core.setOutput('RELEASE_TITLE', title);

  build-desktop:
    name: Build Nexus Parent Desktop (Windows)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Nexus Parent/desktop/src-tauri -> target"
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Desktop Static Frontend
        shell: powershell
        run: |
          cd "Nexus Parent/desktop"
          npm install
          npm run build

      - name: Build Desktop Release Binary
        shell: powershell
        run: |
          cd "Nexus Parent/desktop/src-tauri"
          cargo build --release

      - name: Package Desktop Artifacts
        shell: powershell
        run: |
          $tag = "${{ needs.version.outputs.release_tag }}"
          mkdir -p artifacts
          
          $bin = "Nexus Parent/desktop/src-tauri/target/release/nexus-parent.exe"
          if (Test-Path $bin) {
              $fileName = "nexus-parent-$tag-windows-x86_64.exe"
              $dest = "artifacts/$fileName"
              Copy-Item $bin $dest
              $sha256 = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLowerInvariant()
              Set-Content -Path "$dest.sha256" -Value "$sha256  $fileName" -NoNewline -Encoding ASCII
              Write-Host "Packaged Desktop binary to $dest (SHA-256: $sha256)"
          } else {
              Write-Error "Desktop binary not found at $bin!"
              exit 1
          }

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-stable-binaries
          path: artifacts/*
          if-no-files-found: error

  build-android:
    name: Build Nexus Mobile Clients (Android Child & Parent)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Root Environment Stub
        run: |
          touch .env
          echo 'apiKey="stable-release-build"' >> .env
          echo 'projectId="nexus-stable"' >> .env
          echo 'databaseURL="https://nexus-stable.firebaseio.com"' >> .env
          echo 'appId="1:000000000000:android:0000000000000000"' >> .env
          echo 'authDomain="nexus-stable.firebaseapp.com"' >> .env
          echo 'storageBucket="nexus-stable.appspot.com"' >> .env

      - name: Build Nexus Child Debug APK
        working-directory: "Nexus Child"
        run: |
          TAG="${{ needs.version.outputs.release_tag }}"
          VER_CLEAN="${TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$VER_CLEAN"
          VER_CODE=$(( (${MAJ:-0} * 10000) + (${MIN:-0} * 100) + ${PAT:-0} + 1 ))
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PnexusVersionName="$VER_CLEAN" -PnexusVersionCode="$VER_CODE"

      - name: Build Nexus Parent Debug APK
        working-directory: "Nexus Parent/android"
        run: |
          TAG="${{ needs.version.outputs.release_tag }}"
          VER_CLEAN="${TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$VER_CLEAN"
          VER_CODE=$(( (${MAJ:-0} * 10000) + (${MIN:-0} * 100) + ${PAT:-0} + 1 ))
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PnexusVersionName="$VER_CLEAN" -PnexusVersionCode="$VER_CODE"

      - name: Package Android Artifacts
        run: |
          TAG="${{ needs.version.outputs.release_tag }}"
          mkdir -p android_artifacts
          cp "Nexus Child/app/build/outputs/apk/debug/app-debug.apk" "android_artifacts/nexus-child-${TAG}.apk"
          cp "Nexus Parent/android/app/build/outputs/apk/debug/app-debug.apk" "android_artifacts/nexus-parent-${TAG}.apk"
          (cd android_artifacts && sha256sum "nexus-parent-${TAG}.apk" > "nexus-parent-${TAG}.apk.sha256")

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-stable-binaries
          path: android_artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Stable Release
    needs: [version, build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexus-desktop-stable-binaries
          path: dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexus-android-stable-binaries
          path: dist

      - name: Delete existing release/tag if re-running
        run: |
          gh release delete ${{ needs.version.outputs.release_tag }} --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.version.outputs.release_tag }}
          git push origin ${{ needs.version.outputs.release_tag }}

      - name: Publish GitHub Stable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_title }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
